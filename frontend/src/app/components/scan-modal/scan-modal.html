<div class="modal-overlay" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Configure Scan</h2>
      <button class="btn-close" (click)="onClose()">&times;</button>
    </div>
    
    <div class="modal-body">
      <p class="modal-desc">Enter the absolute path of the local directory you want to scan for vulnerabilities, secrets, and misconfigurations.</p>
      
      <div class="input-group">
        <label for="dirPath">Local Directory Path</label>
        <input type="text" id="dirPath" #dirInput placeholder="e.g. D:\source-codes\nexus\nxs-steam-engine" (keyup.enter)="onRun(dirInput.value)" class="scan-input" autofocus>
      </div>
    </div>
    
    <div class="modal-footer">
      <button class="btn-secondary" (click)="onClose()">Cancel</button>
      <button class="btn-primary" (click)="onRun(dirInput.value)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Trigger Scan
      </button>
    </div>
  </div>
</div>
