<header class="navbar-light">
  <div class="nav-container">
    <!-- Brand / Logo -->
    <div class="brand" routerLink="/dashboard" style="display: flex; align-items: center;">
      <img src="assets/visor-logo.jpg" alt="VISOR Logo" style="height: 45px; margin-right: 15px; border-radius: 6px;" />
      <div class="brand-text">
        <span class="brand-title">VINDICATOR</span>
        <span class="brand-subtitle">VISOR &bull; Intelligent Security Orchestration & Remediation</span>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <nav class="nav-links">
      <button 
        class="nav-tab" 
        routerLink="/dashboard" 
        routerLinkActive="active">
        <span>Executive Dashboard</span>
      </button>
      <button 
        class="nav-tab" 
        routerLink="/findings" 
        routerLinkActive="active">
        <span>Findings Explorer</span>
      </button>
      <button 
        class="nav-tab" 
        routerLink="/remediation" 
        routerLinkActive="active">
        <span>Automated Remediation</span>
      </button>
      <button 
        class="nav-tab" 
        routerLink="/config" 
        routerLinkActive="active">
        <span>Scanners &amp; Exclusions</span>
      </button>
    </nav>

    <!-- Right Controls -->
    <div class="nav-actions">
      <button class="btn-primary" (click)="onOpenScanModal()">
        <span>Run Scan</span>
      </button>
    </div>
  </div>
</header>
