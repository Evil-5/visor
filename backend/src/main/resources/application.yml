server:
  port: ${PORT:8201}

spring:
  application:
    name: vindicator-security-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/vindicator-security}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

vindicator:
  security:
    jwk-set-uri: ${JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
    cors:
      allowed-origins: ${FRONTEND_URL:http://localhost:4200}
    remediation:
      renovate-enabled: ${RENOVATE_ENABLED:true}
      openrewrite-enabled: ${OPENREWRITE_ENABLED:true}

logging:
  level:
    com.vindicator.security: INFO
    org.springframework.web: INFO
    org.springframework.data.mongodb: WARN
